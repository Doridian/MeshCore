[MiniPCIeLoRa]
extends = esp32_base
board = minipcielora
build_flags =
  ${esp32_base.build_flags}
  -I variants/minipcielora
  -D MINI_PCIE_LORA
  -D P_LORA_DIO_1=11
  -D P_LORA_DIO_2=10
  -D P_LORA_NSS=6
  -D P_LORA_RESET=17
  -D P_LORA_BUSY=18
  -D P_LORA_SCLK=7
  -D P_LORA_MISO=16
  -D P_LORA_MOSI=15
  -D PIN_BOARD_SDA=39
  -D PIN_BOARD_SCL=40
  -D SX126X_RXEN=4
  -D SX126X_TXEN=5

  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D SX126X_RX_BOOSTED_GAIN=1
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/minipcielora>
lib_deps =
  ${esp32_base.lib_deps}

; === MiniPCIeLoRa environments ===
[env:MiniPCIeLoRa_Repeater]
extends = MiniPCIeLoRa
build_flags =
  ${MiniPCIeLoRa.build_flags}
  -D ADVERT_NAME='"MiniPCIeLoRa Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${MiniPCIeLoRa.build_src_filter}
  +<../examples/simple_repeater>
lib_deps =
  ${MiniPCIeLoRa.lib_deps}
  ${esp32_ota.lib_deps}

[env:MiniPCIeLoRa_terminal_chat]
extends = MiniPCIeLoRa
build_flags =
  ${MiniPCIeLoRa.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${MiniPCIeLoRa.build_src_filter}
  +<../examples/simple_secure_chat/main.cpp>
lib_deps =
  ${MiniPCIeLoRa.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:MiniPCIeLoRa_room_server]
extends = MiniPCIeLoRa
build_flags =
  ${MiniPCIeLoRa.build_flags}
  -D ADVERT_NAME='"MiniPCIeLoRa Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${MiniPCIeLoRa.build_src_filter}
  +<../examples/simple_room_server>
lib_deps =
  ${MiniPCIeLoRa.lib_deps}
  ${esp32_ota.lib_deps}

[env:MiniPCIeLoRa_companion_radio_usb]
extends = MiniPCIeLoRa
build_flags =
  ${MiniPCIeLoRa.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
; NOTE: DO NOT ENABLE -->  -D MESH_PACKET_LOGGING=1
; NOTE: DO NOT ENABLE -->  -D MESH_DEBUG=1
build_src_filter = ${MiniPCIeLoRa.build_src_filter}
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${MiniPCIeLoRa.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:MiniPCIeLoRa_companion_radio_ble]
extends = MiniPCIeLoRa
build_flags =
  ${MiniPCIeLoRa.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D BLE_DEBUG_LOGGING=1
  -D OFFLINE_QUEUE_SIZE=256
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${MiniPCIeLoRa.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${MiniPCIeLoRa.lib_deps}
  densaugeo/base64 @ ~1.4.0
